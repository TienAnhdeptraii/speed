spring.application.name=speed

# Local MySQL defaults. Override these with DB_URL, DB_USERNAME, and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/speed}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Required: set APP_JWT_SECRET to a Base64-encoded random key of at least 256 bits.
app.jwt-secret=${APP_JWT_SECRET}
app.jwt-expiration-milliseconds=${APP_JWT_EXPIRATION_MS:86400000}

game.inventory.car-item-ids=13703,21901,12720,26931,24859
